name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set -e
          N=${{ github.run_number }}
          V=1.0.$N
          sed -i "s/__VERSION__/$V/" www/index.html
          npm ci --ignore-scripts
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' $M
          sed -i 's/<application/<application android:usesCleartextTraffic="false"/' $M
          npx cap sync android
          sed -i "s/versionCode 1/versionCode $N/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          (cd android && ./gradlew assembleRelease)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          echo "$KS_B64" | base64 -d > ks.p12
          $BT/apksigner sign --ks ks.p12 --ks-pass env:KS_PASS --out PokeAssistente.apk aligned.apk
          rm -f ks.p12
          $BT/apksigner verify PokeAssistente.apk
          if $BT/aapt dump xmltree PokeAssistente.apk AndroidManifest.xml | grep -q debuggable; then echo "APK debuggable"; exit 1; fi
          echo "V=$V" >> $GITHUB_ENV
          echo "SHA=$(sha256sum PokeAssistente.apk | cut -d' ' -f1)" >> $GITHUB_ENV
      - name: Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release create "v$V" PokeAssistente.apk --title "v$V" --notes "Build de release assinado. SHA-256: $SHA"
